apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Set namespace for all resources
namespace: k8s-gather

resources:
  - serviceaccount.yaml
  - clusterrolebinding.yaml
  - clusterrole.yaml
  - job.yaml

# Patch ClusterRoleBinding to use the correct namespace in subjects
patches:
  - target:
      kind: ClusterRoleBinding
      name: k8s-gather-admin
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: k8s-gather
